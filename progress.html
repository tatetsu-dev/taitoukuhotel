<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>台東区ホテルPJ 仕様書・見積り進捗管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface2: #f0f2f8;
      --border: #e0e4ef;
      --accent: #2563eb;
      --accent-light: #eff4ff;
      --accent2: #059669;
      --accent2-light: #ecfdf5;
      --warn: #d97706;
      --warn-light: #fffbeb;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --purple: #7c3aed;
      --purple-light: #f5f3ff;
      --text: #1e2235;
      --text2: #64748b;
      --text3: #b0bac8;
      --check: #059669;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(30,34,53,0.08);
      --shadow-lg: 0 8px 32px rgba(30,34,53,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ===== HEADER ===== */
    header {
      background: var(--surface); border-bottom: 1.5px solid var(--border);
      padding: 0 24px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0; gap: 16px; flex-wrap: wrap;
    }
    .header-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .header-title { font-size: 1.05rem; font-weight: 800; color: var(--text); white-space: nowrap; }
    .deadline-badge {
      display: flex; align-items: center; gap: 6px;
      background: var(--warn-light); border: 1.5px solid #fcd34d;
      border-radius: 20px; padding: 5px 14px; font-size: 0.8rem; font-weight: 600;
    }
    .deadline-badge .dl-label { color: var(--text2); }
    .deadline-badge .dl-date { color: var(--warn); }
    .deadline-badge .dl-remain { color: var(--danger); font-weight: 700; }
    .deadline-badge.urgent { background: var(--danger-light); border-color: #fca5a5; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .updated-text { font-size: 0.72rem; color: var(--text3); }
    .live-badge {
      display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--accent2);
      font-weight: 600; background: var(--accent2-light); border-radius: 20px; padding: 4px 12px;
    }
    .live-dot { width: 7px; height: 7px; background: var(--accent2); border-radius: 50%; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.75)} }
    .live-badge.offline { color: var(--danger); background: var(--danger-light); }
    .live-badge.offline .live-dot { background: var(--danger); animation: none; }

    /* ===== MAIN ===== */
    main { padding: 24px 16px; max-width: 1200px; margin: 0 auto; }
    @media (min-width: 640px) { main { padding: 28px 24px; } }

    /* ===== SUMMARY ===== */
    .summary { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 24px; }
    @media (min-width: 640px) { .summary { grid-template-columns: repeat(5,1fr); } }
    .summary-card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
    }
    .summary-card .s-label { font-size: 0.7rem; color: var(--text2); margin-bottom: 6px; font-weight: 600; }
    .summary-card .s-value { font-size: 1.55rem; font-weight: 800; font-family: 'DM Mono', monospace; }
    .summary-card.c-blue .s-value { color: var(--accent); }
    .summary-card.c-green .s-value { color: var(--accent2); }
    .summary-card.c-warn .s-value { color: var(--warn); }
    .summary-card.c-purple .s-value { color: var(--purple); }

    /* ===== ADD FORM ===== */
    .add-section {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 20px 22px; margin-bottom: 24px; box-shadow: var(--shadow);
    }
    .add-section-title {
      font-size: 0.8rem; font-weight: 700; color: var(--text2);
      margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .maker-input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .maker-input-label { font-size: 0.78rem; font-weight: 600; color: var(--text2); width: 72px; flex-shrink: 0; }
    .maker-input-field {
      flex: 1; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 9px 12px;
      font-size: 0.9rem; font-family: 'Noto Sans JP', sans-serif; transition: border-color 0.2s;
    }
    .maker-input-field:focus { outline: none; border-color: var(--accent); }
    .maker-input-field::placeholder { color: var(--text3); font-size: 0.82rem; }
    .product-inputs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .product-input-row { display: flex; align-items: center; gap: 10px; }
    .product-input-label { font-size: 0.78rem; font-weight: 600; color: var(--text2); width: 72px; flex-shrink: 0; }
    .product-input-field {
      flex: 1; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 9px 12px;
      font-size: 0.9rem; font-family: 'Noto Sans JP', sans-serif; transition: border-color 0.2s;
    }
    .product-input-field:focus { outline: none; border-color: var(--accent); }
    .product-input-field::placeholder { color: var(--text3); font-size: 0.82rem; }
    .btn-remove-product {
      background: none; border: none; color: var(--text3); cursor: pointer;
      font-size: 1.1rem; padding: 4px 6px; border-radius: 6px; transition: all 0.2s; flex-shrink: 0;
    }
    .btn-remove-product:hover { background: var(--danger-light); color: var(--danger); }
    .btn-add-product-row {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: 1.5px dashed var(--border); border-radius: 8px;
      color: var(--accent); font-size: 0.82rem; font-weight: 600; cursor: pointer;
      padding: 7px 14px; margin-left: 82px; margin-bottom: 16px; transition: all 0.2s;
    }
    .btn-add-product-row:hover { background: var(--accent-light); border-color: var(--accent); }
    .form-actions { display: flex; justify-content: flex-end; }
    .btn-register {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 10px 28px; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-register:hover { opacity: 0.85; }

    /* ===== MAKER GROUPS ===== */
    .maker-group { margin-bottom: 20px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .maker-header {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 11px 16px; background: var(--accent); color: #fff;
    }
    .maker-name { font-weight: 700; font-size: 0.95rem; flex: 1; min-width: 120px; }
    .maker-spec-rate { font-size: 0.75rem; opacity: 0.85; white-space: nowrap; }
    .maker-total { font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 700; white-space: nowrap; }
    .maker-actions { display: flex; gap: 6px; margin-left: auto; }
    .btn-add-row {
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5);
      border-radius: 6px; color: #fff; font-size: 0.75rem; font-weight: 700;
      padding: 4px 10px; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .btn-add-row:hover { background: rgba(255,255,255,0.35); }
    .btn-delete-maker {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px; color: rgba(255,255,255,0.8); font-size: 0.75rem;
      padding: 4px 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-delete-maker:hover { background: rgba(220,38,38,0.5); border-color: #fca5a5; color: #fff; }

    /* ===== TABLE (PC) ===== */
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    thead tr { background: var(--surface2); border-bottom: 1.5px solid var(--border); }
    th { padding: 9px 12px; font-size: 0.72rem; font-weight: 700; color: var(--text2); text-align: left; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 10px 12px; font-size: 0.88rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f9ff; }
    .product-name { font-weight: 500; }
    .price-input {
      background: var(--bg); border: 1.5px solid var(--border); border-radius: 6px;
      color: var(--warn); padding: 5px 8px; font-size: 0.85rem;
      font-family: 'DM Mono', monospace; width: 110px; text-align: right; transition: border-color 0.2s;
    }
    .price-input:focus { outline: none; border-color: var(--warn); }
    .check-cell { text-align: center; }
    .custom-check { position: relative; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .custom-check input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .check-box {
      width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 6px;
      background: var(--bg); transition: all 0.18s; display: flex; align-items: center; justify-content: center;
    }
    .custom-check input:checked ~ .check-box { background: var(--check); border-color: var(--check); }
    .check-mark { display: none; color: #fff; font-size: 14px; font-weight: 700; }
    .custom-check input:checked ~ .check-box .check-mark { display: block; }
    .custom-check.requested input:checked ~ .check-box { background: var(--purple); border-color: var(--purple); }
    .status-badge { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .status-ok { background: var(--accent2-light); color: var(--accent2); }
    .status-ng { background: var(--danger-light); color: var(--danger); }
    .btn-del-row {
      background: none; border: none; color: var(--text3); cursor: pointer;
      font-size: 0.95rem; padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
    }
    .btn-del-row:hover { background: var(--danger-light); color: var(--danger); }
    .inline-add-row td { background: #f0f6ff; padding: 8px 12px; }
    .inline-input {
      background: #fff; border: 1.5px solid var(--accent); border-radius: 6px;
      color: var(--text); padding: 6px 9px; font-size: 0.85rem;
      font-family: 'Noto Sans JP', sans-serif; width: 100%;
    }
    .inline-input:focus { outline: none; }
    .btn-inline-save {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    .btn-inline-cancel {
      background: var(--surface2); color: var(--text2); border: none; border-radius: 6px;
      padding: 6px 10px; font-size: 0.82rem; cursor: pointer; margin-left: 4px;
    }

    /* ===== スマホ用カードレイアウト ===== */
    @media (max-width: 640px) {
      /* ヘッダー */
      header { padding: 0 14px; }
      .header-title { font-size: 0.88rem; }
      .deadline-badge { font-size: 0.72rem; padding: 4px 10px; }

      /* メイン */
      main { padding: 14px 12px; }

      /* フォーム */
      .add-section { padding: 14px 14px; }
      .maker-input-row, .product-input-row { flex-direction: column; align-items: flex-start; gap: 5px; }
      .maker-input-label, .product-input-label { width: auto; font-size: 0.75rem; }
      .maker-input-field, .product-input-field { width: 100%; font-size: 0.88rem; padding: 9px 11px; }
      .btn-remove-product { align-self: flex-end; margin-top: -32px; }
      .btn-add-product-row { margin-left: 0; font-size: 0.82rem; width: 100%; justify-content: center; }
      .btn-register { width: 100%; padding: 11px; font-size: 0.92rem; }
      .form-actions { margin-top: 4px; }

      /* メーカーヘッダー */
      .maker-header { padding: 10px 12px; gap: 6px; }
      .maker-name { font-size: 0.9rem; width: 100%; }
      .maker-spec-rate { font-size: 0.7rem; }
      .maker-actions { width: 100%; justify-content: flex-end; }

      /* テーブル → カード表示 */
      .table-wrapper { overflow-x: visible; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px;
        position: relative;
      }
      tr:last-child { border-bottom: none; }
      tr:hover td { background: transparent; }
      td { padding: 0; border: none; font-size: 0.85rem; }

      /* 商品名 */
      td.product-name {
        font-size: 0.92rem; font-weight: 700;
        margin-bottom: 10px;
        padding-right: 28px;
      }

      /* チェック＋金額を横並び */
      .sp-row {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .sp-check-item {
        display: flex; align-items: center; gap: 6px;
      }
      .sp-check-label {
        font-size: 0.72rem; color: var(--text2); font-weight: 600;
      }
      .check-box { width: 24px; height: 24px; }
      .check-mark { font-size: 13px; }

      /* 金額入力 */
      td.sp-price-cell { margin-bottom: 6px; }
      .price-input { width: 100%; font-size: 0.88rem; padding: 7px 10px; text-align: left; }

      /* 見積状況＋削除ボタン */
      .sp-bottom-row {
        display: flex; align-items: center; justify-content: space-between;
      }

      /* 削除ボタン位置 */
      td.sp-del-cell {
        position: absolute; top: 10px; right: 10px;
      }

      /* インライン追加行 */
      .inline-add-row { padding: 10px 12px; }
      .inline-add-row td { padding: 0; }
    }

    /* ===== スマホカードCSS ===== */
    .sp-card-list { background: var(--surface); }
    .sp-card {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .sp-card:last-child { border-bottom: none; }
    .sp-del {
      position: absolute; top: 10px; right: 10px;
      background: none; border: none; color: var(--text3);
      font-size: 0.9rem; padding: 4px 6px; cursor: pointer;
    }
    .sp-card-name {
      font-size: 0.92rem; font-weight: 700;
      margin-bottom: 10px; padding-right: 28px; line-height: 1.4;
      color: var(--text);
    }
    .sp-card-checks {
      display: flex; gap: 20px; margin-bottom: 10px;
    }
    .sp-check-wrap {
      display: flex; align-items: center; gap: 7px; cursor: pointer;
    }
    .sp-check-label {
      font-size: 0.78rem; font-weight: 600; color: var(--text2);
    }
    .sp-card-price-row {
      display: flex; align-items: center; gap: 10px;
    }
    .sp-card-price-row .price-input {
      flex: 1; width: auto; text-align: left;
    }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--text2); }
    .empty-state .icon { font-size: 2.2rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.88rem; line-height: 1.7; }
    #loading { text-align: center; padding: 50px; color: var(--text2); font-size: 0.88rem; }
    #toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--text); color: #fff; border-radius: 10px;
      padding: 11px 18px; font-size: 0.85rem; box-shadow: var(--shadow-lg);
      transform: translateY(70px); opacity: 0; transition: all 0.3s; z-index: 999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <span class="header-title">台東区ホテルPJ　仕様書・見積り進捗管理</span>
      <div class="deadline-badge" id="deadline-badge">
        <span class="dl-label">期日：</span>
        <span class="dl-date">6月16日</span>
        <span class="dl-remain" id="dl-remain">残り計算中</span>
      </div>
    </div>
    <div class="header-right">
      <span class="updated-text" id="last-updated"></span>
      <div class="live-badge" id="live-badge">
        <div class="live-dot"></div>
        <span>同期中</span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="summary">
    <div class="summary-card c-blue">
      <div class="s-label">依頼メーカー数</div>
      <div class="s-value" id="s-makers">0</div>
    </div>
    <div class="summary-card c-blue">
      <div class="s-label">依頼商品数（合計）</div>
      <div class="s-value" id="s-items">0</div>
    </div>
    <div class="summary-card c-purple">
      <div class="s-label">依頼済み</div>
      <div class="s-value" id="s-requested">0</div>
    </div>
    <div class="summary-card c-green">
      <div class="s-label">仕様書 取得済み</div>
      <div class="s-value" id="s-spec-ok">0</div>
    </div>
    <div class="summary-card c-warn">
      <div class="s-label">見積合計金額</div>
      <div class="s-value" id="s-total">¥0</div>
    </div>
  </div>

  <div class="add-section">
    <div class="add-section-title">＋ メーカー・商品を登録</div>
    <div class="maker-input-row">
      <span class="maker-input-label">メーカー名</span>
      <input type="text" class="maker-input-field" id="inp-maker" placeholder="例：株式会社〇〇" />
    </div>
    <div class="product-inputs" id="product-inputs">
      <div class="product-input-row">
        <span class="product-input-label">商品名</span>
        <input type="text" class="product-input-field" placeholder="例：LED照明 型番A" />
        <button class="btn-remove-product" onclick="removeProductRow(this)" title="削除">✕</button>
      </div>
    </div>
    <button class="btn-add-product-row" onclick="addProductRow()">＋ 商品名を追加</button>
    <div class="form-actions">
      <button class="btn-register" onclick="registerMaker()">登録する</button>
    </div>
  </div>

  <div id="loading">📡 データを読み込んでいます...</div>
  <div id="table-area"></div>
</main>

<div id="toast"></div>

<script type="module">
  // ★ Firebase URL を直接埋め込み（設定画面不要）
  const DB_URL = 'https://taitouku-hotel-pj-default-rtdb.firebaseio.com';
  let currentData = {};

  // ===== DEADLINE =====
  function updateDeadline() {
    const deadline = new Date('2026-06-16T23:59:59');
    const now = new Date();
    const diff = deadline - now;
    const badge = document.getElementById('deadline-badge');
    const remain = document.getElementById('dl-remain');
    if (diff <= 0) {
      remain.textContent = '期日超過';
      badge.classList.add('urgent');
    } else {
      const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
      remain.textContent = `残り ${days} 日`;
      if (days <= 3) badge.classList.add('urgent');
      else badge.classList.remove('urgent');
    }
  }
  updateDeadline();
  setInterval(updateDeadline, 60000);

  // ===== FIREBASE SSE =====
  function subscribeData() {
    const es = new EventSource(`${DB_URL}/items.json`);
    es.addEventListener('put', (e) => {
      const d = JSON.parse(e.data);
      currentData = d.data || {};
      render(); setLive(true);
    });
    es.addEventListener('patch', (e) => {
      const d = JSON.parse(e.data);
      Object.assign(currentData, d.data || {});
      render(); setLive(true);
    });
    es.onerror = () => setLive(false);
  }
  subscribeData();

  async function fbSet(path, value) {
    const res = await fetch(`${DB_URL}/items/${path}.json`, {
      method: 'PUT', body: JSON.stringify(value),
      headers: { 'Content-Type': 'application/json' }
    });
    return res.ok;
  }
  async function fbDelete(path) {
    await fetch(`${DB_URL}/items/${path}.json`, { method: 'DELETE' });
  }
  async function fbPatch(path, value) {
    await fetch(`${DB_URL}/items/${path}.json`, {
      method: 'PATCH', body: JSON.stringify(value),
      headers: { 'Content-Type': 'application/json' }
    });
  }

  // ===== フォーム：商品行を追加 =====
  window.addProductRow = function() {
    const container = document.getElementById('product-inputs');
    const row = document.createElement('div');
    row.className = 'product-input-row';
    row.innerHTML = `
      <span class="product-input-label">商品名</span>
      <input type="text" class="product-input-field" placeholder="例：カーテン 型番B" />
      <button class="btn-remove-product" onclick="removeProductRow(this)" title="削除">✕</button>
    `;
    container.appendChild(row);
    row.querySelector('input').focus();
  };

  window.removeProductRow = function(btn) {
    const rows = document.querySelectorAll('.product-input-row');
    if (rows.length <= 1) { showToast('⚠️ 商品名は最低1つ必要です'); return; }
    btn.closest('.product-input-row').remove();
  };

  // ===== 登録 =====
  window.registerMaker = async function() {
    const maker = document.getElementById('inp-maker').value.trim();
    if (!maker) { showToast('⚠️ メーカー名を入力してください'); return; }
    const productFields = document.querySelectorAll('.product-input-field');
    const products = Array.from(productFields).map(f => f.value.trim()).filter(v => v !== '');
    if (products.length === 0) { showToast('⚠️ 商品名を1つ以上入力してください'); return; }

    const newItems = {};
    for (const product of products) {
      const id = Date.now().toString() + Math.random().toString(36).slice(2, 6);
      const item = { maker, product, price: null, specDone: false, requested: false, createdAt: new Date().toISOString() };
      newItems[id] = item;
      currentData[id] = item;
    }
    render();

    for (const [id, item] of Object.entries(newItems)) {
      await fbSet(id, item);
    }

    document.getElementById('inp-maker').value = '';
    document.getElementById('product-inputs').innerHTML = `
      <div class="product-input-row">
        <span class="product-input-label">商品名</span>
        <input type="text" class="product-input-field" placeholder="例：LED照明 型番A" />
        <button class="btn-remove-product" onclick="removeProductRow(this)" title="削除">✕</button>
      </div>
    `;
    showToast(`✅ ${maker} の商品 ${products.length}件を登録しました`);
  };

  // ===== メーカー内から行追加 =====
  window.showInlineAdd = function(maker) {
    const isSP = window.innerWidth <= 640;
    const containerId = 'tbody-' + btoa(encodeURIComponent(maker));
    const container = document.getElementById(containerId);
    if (!container) return;

    const existingInline = container.querySelector('.inline-sp-add, .inline-add-row');
    if (existingInline) { existingInline.remove(); return; }

    if (isSP) {
      // スマホ：カード末尾に追加フォーム
      const div = document.createElement('div');
      div.className = 'sp-card inline-sp-add';
      div.style.background = '#f0f6ff';
      div.innerHTML = `
        <input class="inline-input" id="ii-prod-sp-${containerId}" placeholder="商品名を入力" style="margin-bottom:8px" />
        <div style="display:flex;gap:6px">
          <button class="btn-inline-save" onclick="saveInlineRowSP('${esc(maker)}','${containerId}')">保存</button>
          <button class="btn-inline-cancel" onclick="this.closest('.inline-sp-add').remove()">✕</button>
        </div>
      `;
      container.appendChild(div);
      div.querySelector('input').focus();
    } else {
      // PC：テーブル末尾に行追加
      const rowId = 'inline-' + CSS.escape(btoa(encodeURIComponent(maker)));
      const tbody = container;
      const tr = document.createElement('tr');
      tr.id = rowId;
      tr.className = 'inline-add-row';
      tr.innerHTML = `
        <td><input class="inline-input" id="ii-prod-${rowId}" placeholder="商品名を入力" /></td>
        <td class="check-cell">—</td>
        <td class="check-cell">—</td>
        <td>—</td>
        <td>—</td>
        <td>
          <button class="btn-inline-save" onclick="saveInlineRow('${esc(maker)}','${rowId}')">保存</button>
          <button class="btn-inline-cancel" onclick="document.getElementById('${rowId}').remove()">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
      document.getElementById('ii-prod-' + rowId)?.focus();
    }
  };

  window.saveInlineRowSP = async function(maker, containerId) {
    const product = document.getElementById('ii-prod-sp-' + containerId)?.value.trim();
    if (!product) { showToast('⚠️ 商品名を入力してください'); return; }
    const id = Date.now().toString() + Math.random().toString(36).slice(2, 6);
    const item = { maker, product, price: null, specDone: false, requested: false, createdAt: new Date().toISOString() };
    currentData[id] = item;
    render();
    await fbSet(id, item);
    showToast('✅ 商品を追加しました');
  };

  window.saveInlineRow = async function(maker, rowId) {
    const product = document.getElementById('ii-prod-' + rowId)?.value.trim();
    if (!product) { showToast('⚠️ 商品名を入力してください'); return; }
    const id = Date.now().toString() + Math.random().toString(36).slice(2, 6);
    const item = { maker, product, price: null, specDone: false, requested: false, createdAt: new Date().toISOString() };
    currentData[id] = item;
    render();
    await fbSet(id, item);
    showToast('✅ 商品を追加しました');
  };

  // ===== UPDATE =====
  window.updateSpec = async function(id, val) {
    if (currentData[id]) { currentData[id].specDone = val; updateSummary(Object.entries(currentData)); updateTime(); }
    await fbPatch(id, { specDone: val });
  };

  window.updateRequested = async function(id, val) {
    if (currentData[id]) { currentData[id].requested = val; updateSummary(Object.entries(currentData)); updateTime(); }
    await fbPatch(id, { requested: val });
  };

  window.updatePrice = async function(id, val) {
    const price = val === '' ? null : parseInt(val);
    const finalPrice = isNaN(price) ? null : price;
    if (currentData[id]) { currentData[id].price = finalPrice; render(); }
    await fbPatch(id, { price: finalPrice });
  };

  window.deleteItem = async function(id) {
    if (!confirm('この行を削除しますか？')) return;
    delete currentData[id];
    render();
    await fbDelete(id);
    showToast('🗑 削除しました');
  };

  window.deleteMaker = async function(makerName) {
    if (!confirm(`「${makerName}」の依頼をすべて削除しますか？`)) return;
    const ids = Object.entries(currentData).filter(([,v]) => v.maker === makerName).map(([k]) => k);
    for (const id of ids) delete currentData[id];
    render();
    for (const id of ids) await fbDelete(id);
    showToast(`🗑 ${makerName} を削除しました`);
  };

  // ===== RENDER =====
  function render() {
    document.getElementById('loading').style.display = 'none';
    const area = document.getElementById('table-area');
    const items = Object.entries(currentData || {}).sort((a,b) => (a[1].createdAt||'').localeCompare(b[1].createdAt||''));
    const isSP = window.innerWidth <= 640;

    if (items.length === 0) {
      area.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>まだ登録がありません。<br>上のフォームからメーカーと商品を登録してください。</p></div>`;
      updateSummary([]); updateTime(); return;
    }

    const groups = {};
    for (const [id, item] of items) {
      if (!groups[item.maker]) groups[item.maker] = [];
      groups[item.maker].push([id, item]);
    }

    let html = '';
    for (const [maker, rows] of Object.entries(groups)) {
      const total = rows.reduce((s,[,v]) => s + (v.price||0), 0);
      const specCount = rows.filter(([,v]) => v.specDone).length;
      const reqCount = rows.filter(([,v]) => v.requested).length;
      const tbodyId = 'tbody-' + btoa(encodeURIComponent(maker));

      html += `
      <div class="maker-group">
        <div class="maker-header">
          <span class="maker-name">🏢 ${esc(maker)}</span>
          <span class="maker-spec-rate">依頼済み：${reqCount}/${rows.length}　仕様書：${specCount}/${rows.length} 取得</span>
          ${total > 0 ? `<span class="maker-total">¥${total.toLocaleString()}</span>` : ''}
          <div class="maker-actions">
            <button class="btn-add-row" onclick="showInlineAdd('${esc(maker)}')">＋ 商品追加</button>
            <button class="btn-delete-maker" onclick="deleteMaker('${esc(maker)}')">削除</button>
          </div>
        </div>`;

      if (isSP) {
        // ===== スマホ：カード形式 =====
        html += `<div class="sp-card-list" id="${tbodyId}">`;
        for (const [id, item] of rows) {
          const priceVal = (item.price !== null && item.price !== undefined) ? item.price : '';
          const hasPrice = priceVal !== '';
          html += `
          <div class="sp-card" data-id="${id}">
            <button class="btn-del-row sp-del" onclick="deleteItem('${id}')" title="削除">✕</button>
            <div class="sp-card-name">${esc(item.product)}</div>
            <div class="sp-card-checks">
              <label class="sp-check-wrap requested">
                <div class="custom-check requested">
                  <input type="checkbox" ${item.requested ? 'checked' : ''} onchange="updateRequested('${id}', this.checked)" />
                  <div class="check-box"><span class="check-mark">✓</span></div>
                </div>
                <span class="sp-check-label">依頼済み</span>
              </label>
              <label class="sp-check-wrap">
                <div class="custom-check">
                  <input type="checkbox" ${item.specDone ? 'checked' : ''} onchange="updateSpec('${id}', this.checked)" />
                  <div class="check-box"><span class="check-mark">✓</span></div>
                </div>
                <span class="sp-check-label">仕様書</span>
              </label>
            </div>
            <div class="sp-card-price-row">
              <input class="price-input" type="number" value="${priceVal}" placeholder="金額を入力（円）"
                onchange="updatePrice('${id}', this.value)" onblur="updatePrice('${id}', this.value)" />
              ${hasPrice
                ? `<span class="status-badge status-ok">¥${Number(priceVal).toLocaleString()}</span>`
                : `<span class="status-badge status-ng">未入手</span>`}
            </div>
          </div>`;
        }
        html += `</div>`;
      } else {
        // ===== PC：テーブル形式 =====
        html += `<div class="table-wrapper">
        <table>
          <thead><tr>
            <th>商品名</th>
            <th style="text-align:center">依頼済み</th>
            <th style="text-align:center">仕様書</th>
            <th>金額（円）</th>
            <th>見積状況</th>
            <th></th>
          </tr></thead>
          <tbody id="${tbodyId}">`;
        for (const [id, item] of rows) {
          const priceVal = (item.price !== null && item.price !== undefined) ? item.price : '';
          const hasPrice = priceVal !== '';
          html += `
          <tr>
            <td class="product-name">${esc(item.product)}</td>
            <td class="check-cell">
              <label class="custom-check requested">
                <input type="checkbox" ${item.requested ? 'checked' : ''} onchange="updateRequested('${id}', this.checked)" />
                <div class="check-box"><span class="check-mark">✓</span></div>
              </label>
            </td>
            <td class="check-cell">
              <label class="custom-check">
                <input type="checkbox" ${item.specDone ? 'checked' : ''} onchange="updateSpec('${id}', this.checked)" />
                <div class="check-box"><span class="check-mark">✓</span></div>
              </label>
            </td>
            <td>
              <input class="price-input" type="number" value="${priceVal}" placeholder="未入力"
                onchange="updatePrice('${id}', this.value)" onblur="updatePrice('${id}', this.value)" />
            </td>
            <td>
              ${hasPrice
                ? `<span class="status-badge status-ok">¥${Number(priceVal).toLocaleString()}</span>`
                : `<span class="status-badge status-ng">未入手</span>`}
            </td>
            <td><button class="btn-del-row" onclick="deleteItem('${id}')" title="削除">✕</button></td>
          </tr>`;
        }
        html += `</tbody></table></div>`;
      }

      html += `</div>`;
    }

    area.innerHTML = html;
    updateSummary(items);
    updateTime();
  }

  function updateSummary(items) {
    const makers = new Set(items.map(([,v]) => v.maker)).size;
    const specOk = items.filter(([,v]) => v.specDone).length;
    const requested = items.filter(([,v]) => v.requested).length;
    const total = items.reduce((s,[,v]) => s + (v.price||0), 0);
    document.getElementById('s-makers').textContent = makers;
    document.getElementById('s-items').textContent = items.length;
    document.getElementById('s-requested').textContent = requested;
    document.getElementById('s-spec-ok').textContent = specOk;
    document.getElementById('s-total').textContent = '¥' + total.toLocaleString();
  }

  function updateTime() {
    document.getElementById('last-updated').textContent =
      `最終更新：${new Date().toLocaleTimeString('ja-JP')}`;
  }

  function setLive(ok) {
    const b = document.getElementById('live-badge');
    b.className = 'live-badge' + (ok ? '' : ' offline');
    b.querySelector('span').textContent = ok ? '同期中' : '切断中...';
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
